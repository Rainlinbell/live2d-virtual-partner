appId: com.live2d.virtualpartner
productName: Live2D Virtual Partner
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  artifactName: Live2D-Virtual-Partner-${version}-${arch}.${ext}
  # 不做代码签名与 exe 元数据编辑，避免 winCodeSign 依赖（其含 macOS 符号链接，普通权限解压失败）
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 虚拟伴侣
  deleteAppDataOnUninstall: false

